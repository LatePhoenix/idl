[versions]
agp = "8.13.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
navigation = "2.8.5"
room = "2.6.1"
glance = "1.1.1"
work = "2.10.0"
datastore = "1.1.1"
serialization = "1.7.3"
coroutines = "1.9.0"
zxing = "3.5.3"
okhttp = "4.12.0"
junit = "4.13.2"
