name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests with snapshot verify, lint, debug build
        run: ./gradlew verifyRoborazziDebug lintDebug assembleDebug
      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/roborazzi/
          if-no-files-found: ignore

  backend:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: SQL suite (privacy vectors, behaviour, RLS) and start PostgREST
        run: supabase/tests/run.sh --rest
      - name: Kotlin client against PostgREST
        run: ./gradlew testDebugUnitTest --tests '*SupabaseRestIT*' -Pidl.postgrestUrl=http://localhost:54330
      - name: Tear down
        if: always()
        run: supabase/tests/run.sh --down
