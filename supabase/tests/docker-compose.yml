# Local verification stack: stock Postgres + PostgREST with a minimal Supabase auth shim.
# Not a replacement for `supabase start`; it exists so the schema, RLS and RPC contract can be
# tested without a Supabase account. Run via ./run.sh.
name: idl-test
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ../..:/work:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      # Test-only secret; real projects use the Supabase JWT secret.
      PGRST_JWT_SECRET: idl-local-test-secret-at-least-32-chars
    ports:
      - "54330:3000"
